<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AURA Agronomist Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
        }

        #chat {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
        }

        .msg-user {
            color: #1a73e8;
            margin-bottom: 8px;
        }

        .msg-bot {
            color: #333;
            margin-bottom: 12px;
        }

        #controls {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        #question {
            flex: 1;
        }
    </style>
</head>

<body>
    <h2>AURA™ AI Agronomist</h2>

    <div>
        <label>
            <input type="checkbox" id="connectSensors">
            Connect Farm Sensors (farm_102)
        </label>
        <span id="sensorStatus">(sensors: disconnected)</span>
    </div>

    <div id="chat"></div>

    <div id="controls">
        <input type="text" id="question" placeholder="Ask about your crop..." />
        <button id="sendBtn">Send</button>
    </div>

    <script>
        let currentFarmId = null;

        const chatDiv = document.getElementById("chat");
        const questionInput = document.getElementById("question");
        const sendBtn = document.getElementById("sendBtn");
        const connectCheckbox = document.getElementById("connectSensors");
        const sensorStatus = document.getElementById("sensorStatus");

        function addMessage(text, isUser) {
            const div = document.createElement("div");
            div.className = isUser ? "msg-user" : "msg-bot";
            div.textContent = text;
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function sendQuestion() {
            const q = questionInput.value.trim();
            if (!q) return;

            addMessage("You: " + q, true);
            questionInput.value = "";

            const payload = { question: q };
            if (currentFarmId) {
                payload.farm_id = currentFarmId;
            }

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (data.error) {
                    addMessage("Error: " + data.error, false);
                } else {
                    addMessage("AURA: " + data.answer, false);
                }
            } catch (e) {
                addMessage("Error calling API: " + e, false);
            }
        }

        sendBtn.addEventListener("click", sendQuestion);
        questionInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendQuestion();
        });

        connectCheckbox.addEventListener("change", async () => {
            if (connectCheckbox.checked) {
                try {
                    const res = await fetch("/api/connect_farm", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ farm_id: "farm_102" }),
                    });
                    const data = await res.json();
                    if (data.error) {
                        connectCheckbox.checked = false;
                        sensorStatus.textContent = "(error connecting sensors)";
                    } else {
                        currentFarmId = data.farm_id;
                        sensorStatus.textContent = `(sensors: connected to ${currentFarmId})`;
                    }
                } catch (e) {
                    connectCheckbox.checked = false;
                    sensorStatus.textContent = "(error connecting sensors)";
                }
            } else {
                try {
                    await fetch("/api/connect_farm", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ farm_id: null }),
                    });
                } catch (e) { }
                currentFarmId = null;
                sensorStatus.textContent = "(sensors: disconnected)";
            }
        });
    </script>
</body>

</html>
